<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>

  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 sidebar p-4">
        <div class="text-center mb-4">
          <div class="mb-2">
            <img src="img/avatar.jpg" alt="Admin" class="rounded-circle" width="60" />
          </div>
          <strong>Administrator Name</strong>
          <p class="small">
            <span class="text-muted"> admin@gmail.com </span> <br>
            <a class="text-decoration-none" href="admin-profile.html">View Profile</a>
          </p>
        </div>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i
                class="fa-solid fa-chart-pie"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="user-registration.html"><i
                class="fa-solid fa-user"></i>User</a></li>
          <li class="nav-item"><a class="nav-link" href="plan-management.html"><i
                class="fa-solid fa-calendar-check"></i>Plan</a></li>
          <li class="nav-item"><a class="nav-link active" href="cash-payment.html"><i
                class="fa-solid fa-credit-card"></i>Payment</a></li>
          <!-- Sidebar Dropdown for Report -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="reportDropdown" role="button" data-bs-toggle="dropdown"
              aria-expanded="false">
              <i class="fa-solid fa-book-open"></i> Report
            </a>
            <ul class="dropdown-menu" aria-labelledby="reportDropdown">
              <li><a class="dropdown-item" href="members.html"><i class="fa-solid fa-users"></i>Members</a></li>
              <li><a class="dropdown-item" href="sales.html"> <i class="fa-solid fa-book-open"></i>Sales</a></li>
            </ul>
          </li>

        </ul>
        <div class="mt-4">
          <a href="#" class="text-danger text-decoration-none"><i
              class="logout fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
        </div>
      </div>


      <!-- Main Content -->
      <div class="col-md-9 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3>Payment</h3>
        </div>
        <div class="card-body">
          <form>
            <div class="container-fullname">
              <div class="member-form">
                <label for="lastName" class="lastname">Last Name: </label><br>
                <input type="text" class="form-member" id="lastName" placeholder="Enter Last Name" required>
              </div>
              <div class="member-form">
                <label for="firstName" class="firstname">First Name: </label><br>
                <input type="text" class="form-member" id="firstName" placeholder="Enter First Name" required>
              </div>
            </div>
            <div class="container-datenplan">
              <div class="plan-form">
                <label for="plan">Plan</label><br>
                  <select class="plan-date" id="plan" name="plan" required>
                    <option disabled selected>Select Plan</option>
                    <option value="rebond">Rebond</option>
                    <option value="salon">Salon</option>
                    <option value="spa">Foot spa</option>
                    <option value="haircut">Haircut</option>
                  </select>
              </div>
              <div class="plan-form">
                <label for="plan">Price</label><br>
                  <select class="plan-date" id="plan" name="plan" required>
                    <option disabled selected>Select Price</option>
                    <option value="599">599</option>
                    <option value="1899">1899</option>
                    <option value="2499">2499</option>
                    <option value="4500">4500</option>
                  </select>
              </div>
                <div class="dateJoin-form">
                  <label for="date-join" class="textBox">Date of Join</label><br>
                  <input type="date" class="plan-date" id="date-join" required>
                </div>
            </div>
              <button class="next-btn">Next</button>
              <button type="reset" class="cancel-btn">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
