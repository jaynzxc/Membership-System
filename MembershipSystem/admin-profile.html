<!-- admin-profile.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>

  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 sidebar p-4">
        <div class="text-center mb-4">
          <div class="mb-2">
            <img src="img/avatar.jpg" alt="Admin" class="rounded-circle" width="60" />
          </div>
          <strong>Administrator Name</strong>
          <p class="small">
            <span class="text-muted"> admin@gmail.com </span> <br>
            <a class="text-decoration-none" href="admin-profile.html">View Profile</a>
          </p>
        </div>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i
                class="fa-solid fa-chart-pie"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="user-registration.html"><i
                class="fa-solid fa-user"></i>User</a></li>
          <li class="nav-item"><a class="nav-link" href="plan-management.html"><i
                class="fa-solid fa-calendar-check"></i>Plan</a></li>
          <li class="nav-item"><a class="nav-link" href="cash-payment.html"><i
                class="fa-solid fa-credit-card"></i>Payment</a></li>
          <!-- Sidebar Dropdown for Report -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="reportDropdown" role="button" data-bs-toggle="dropdown"
              aria-expanded="false">
              <i class="fa-solid fa-book-open"></i> Report
            </a>
            <ul class="dropdown-menu" aria-labelledby="reportDropdown">
              <li><a class="dropdown-item" href="members.html"><i class="fa-solid fa-users"></i>Members</a></li>
              <li><a class="dropdown-item " href="sales.html"> <i class="fa-solid fa-book-open"></i>Sales</a></li>
            </ul>
          </li>

        </ul>
        <div class="mt-4">
          <a href="index.html" class="text-danger text-decoration-none"><i
              class="logout fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-md-9 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3>Admin Information</h3>
        </div>

        <div class="row g-4">
          <div class="col-md-4">
            <div class="card-custom text-center">
              <img src="img/avatar.jpg" alt="Profile" class="rounded-circle mb-3" width="80">
              <p class="fw-bold">Username: admin</p>
              <p>Contact No.: 09123456789</p>
              <p>Email Address: admin@gmail.com</p>
              <button class="btn btn-custom btn-sm mt-2">Update Profile</button>
              <hr>
              <button class="btn btn-custom w-100">Register New Admin Account</button>
            </div>
          </div>

          <div class="col-md-8">
            <div class="card-custom mb-4">
              <form>
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="username" placeholder="admin">
                </div>
                <div class="mb-3">
                  <label for="contact" class="form-label">Contact No.</label>
                  <input type="text" class="form-control" id="contact" placeholder="09123456789">
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email Address</label>
                  <input type="email" class="form-control" id="email" placeholder="admin@gmail.com">
                </div>
                <button class="btn btn-custom">Save</button>
                <button type="reset" class="btn btn-secondary ms-2">Cancel</button>
              </form>
            </div>

            <div class="card-custom">
              <form>
                <h5 class="mb-3">Password</h5>
                <div class="mb-3">
                  <label for="currentPassword" class="form-label">Current Password</label>
                  <input type="password" class="form-control" id="currentPassword">
                </div>
                <div class="mb-3">
                  <label for="newPassword" class="form-label">New Password</label>
                  <input type="password" class="form-control" id="newPassword">
                </div>
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">Re-type Password</label>
                  <input type="password" class="form-control" id="confirmPassword">
                </div>
                <button class="btn btn-custom">Change</button>
                <button type="reset" class="btn btn-secondary ms-2">Clear</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
